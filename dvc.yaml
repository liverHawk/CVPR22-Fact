# ${...} vars are resolved from params.yaml, so output paths track the config.
# Constraint: flow_data_dir / index_list_dir / dataset must be concrete
# (non-null) in params.yaml for DVC to resolve outs.
vars:
  - params.yaml

stages:
  make_session:
    cmd: uv run python scripts/make_session.py --config params.yaml
    params:
      - params.yaml:
          - dataset
          - seed
          - index_list_dir
          - session_seed
          - overwrite_session
          - flow_glob
          - flow_data_dir
          - label_col
          - drop_cols
          - label_aliases
          - base_classes
          - base_class_num
          - session_way
          - session_shot
          - exclude_labels
          - test_size
    outs:
      - ${index_list_dir}/${dataset}:
          persist: true
      # Side-effect artifacts in flow_data_dir that train/tune/test read
      # directly (cicflow dataloader + data_utils + mlp_encoder). Tracked with
      # cache: false (they live outside the repo) + persist: true (DVC must
      # never delete the real data), so a missing artifact reruns make_session
      # instead of crashing the consumer deep inside the dataloader.
      - ${flow_data_dir}/feature_cols.json:
          persist: true
          cache: false
      - ${flow_data_dir}/label_map.json:
          persist: true
          cache: false
      - ${flow_data_dir}/scaler.pkl:
          persist: true
          cache: false
      - ${flow_data_dir}/train.parquet:
          persist: true
          cache: false
      - ${flow_data_dir}/test.parquet:
          persist: true
          cache: false
  train:
    cmd: uv run python train.py --config params.yaml --metrics-file dvc_metrics.json
    deps:
      - ${index_list_dir}/${dataset}
      - ${flow_data_dir}/feature_cols.json
      - ${flow_data_dir}/label_map.json
      - ${flow_data_dir}/scaler.pkl
      - ${flow_data_dir}/train.parquet
      - ${flow_data_dir}/test.parquet
    params:
      - params.yaml:
    metrics:
      - dvc_metrics.json:
          cache: false
    outs:
      - checkpoint/:
          persist: true
  test:
    cmd: >-
      uv run python test.py --config params.yaml
      --test-metrics-file dvc_test_metrics.json
    deps:
      - checkpoint/
      - ${index_list_dir}/${dataset}
      - ${flow_data_dir}/feature_cols.json
      - ${flow_data_dir}/label_map.json
      - ${flow_data_dir}/scaler.pkl
      - ${flow_data_dir}/train.parquet
      - ${flow_data_dir}/test.parquet
    params:
      - params.yaml:
    metrics:
      - dvc_test_metrics.json:
          cache: false
  # Optuna sweep. Runs through DVC so make_session's index files are a real
  # dep (sessions are rebuilt first if missing) and the search space /
  # params changes trigger a re-run. Fresh in-memory study per repro; for
  # long resumable searches run tune.py directly with sqlite storage.
  # After tuning, promote best_params.yaml into params.yaml and `dvc repro`
  # to re-run train+test on the winner.
  tune:
    cmd: >-
      uv run python tune.py --base-config params.yaml --trials 20
      --storage "" --params-out best_params.yaml --metrics-out tune_metrics.json
    deps:
      - ${index_list_dir}/${dataset}
      - ${flow_data_dir}/feature_cols.json
      - ${flow_data_dir}/label_map.json
      - ${flow_data_dir}/scaler.pkl
      - ${flow_data_dir}/train.parquet
      - ${flow_data_dir}/test.parquet
    params:
      # dict form with null = track the whole file; a bare string would be
      # read as a KEY inside the default params.yaml
      - params.yaml:
      - tune_space.yaml:
    metrics:
      - tune_metrics.json:
          cache: false
    outs:
      - best_params.yaml:
          cache: false
