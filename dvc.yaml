stages:
  split_dataset:
    cmd: uv run split_dataset_by_label.py
    deps:
      - split_dataset_by_label.py
    params:
      - params.yaml:
          - dataset_name
          - create_sessions.dataset_name
    outs:
      - data/${dataset_name}/train
      - data/${dataset_name}/test
  create_sessions:
    cmd: uv run create_session_files.py
    deps:
      - create_session_files.py
    params:
      - params.yaml:
          - dataset_name
          - create_sessions.dataset_name
    outs:
      - data/index_list/${dataset_name}
