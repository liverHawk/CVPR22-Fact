  train_base:
    cmd: uv run train_base.py
    deps:
      - train_base.py
      - data/index_list/${dataset_name}
    params:
      - params.yaml:
          - project
          - dataset_type
          - dataset_name
          - encoder
          - epochs_base
          - lr_base
          - batch_size_base
          - test_batch_size
          - base_mode
          - schedule
          - milestones
          - step
          - decay
          - gamma
          - momentum
          - temperature
          - balance
          - alpha
          - eta
          - loss_iter
          - num_workers
          - gpu
          - seed
          - normalize_method
          - label_column
          - base_class
          - num_classes
          - way
          - shot
    outs:
      - checkpoint/${dataset_name}/session0_max_acc.pth
      - checkpoint/${dataset_name}/optimizer_best.pth
  train_new:
    cmd: uv run train_new.py --model-dir checkpoint/${dataset_name}/session0_max_acc.pth
    deps:
      - train_new.py
      - data/index_list/${dataset_name}
      - checkpoint/${dataset_name}/session0_max_acc.pth
    params:
      - params.yaml:
          - project
          - dataset_type
          - dataset_name
          - encoder
          - epochs_new
          - lr_new
          - batch_size_new
          - test_batch_size
          - new_mode
          - temperature
          - balance
          - alpha
          - eta
          - loss_iter
          - num_workers
          - gpu
          - seed
          - normalize_method
          - label_column
          - base_class
          - num_classes
          - way
          - shot
