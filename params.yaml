# FACT: Forward Compatible Few-Shot Class-Incremental Learning
# 設定ファイル - このファイルからデフォルト値を読み込みます

# 基本設定
project: fact    # 'base' または 'fact'
dataset_type: cifar100    # 'mini_imagenet', 'cub200', 'cifar100', 'CICIDS2017_improved'
dataset_name: cifar100
dataroot: data/
encoder: mlp  # 'mlp' または 'cnn1d'（CICIDS2017_improved用）
normalize_method: moving_minmax    # 'standard', 'minmax', 'moving_minmax'
label_column: Label    # ラベル列の名前（CICIDS2017_improved用）
input_dir: /home/hawk/Documents/school/dataset/project/cleaned   # 入力ディレクトリのパス

# トレーニング
epochs_base: 600
epochs_new: 100
lr_base: 0.1
lr_new: 0.1
batch_size_base: 256
batch_size_new: 0  # 0で全データ使用
test_batch_size: 100

# モード設定
base_mode: ft_cos    # 'ft_dot' または 'ft_cos'
new_mode: avg_cos    # 'ft_dot', 'ft_cos', または 'avg_cos'

# 学習率スケジュール
schedule: Cosine      # 'Step', 'Milestone', 'Cosine'
milestones:
- 60
- 70
step: 20
decay: 0.0005
gamma: 0.1
momentum: 0.9
temperature: 16

# FACT固有のパラメータ
balance: 0.001
alpha: 0.5
eta: 0.1
loss_iter: 0

# FSCIL用のパラメータ
base_class: 60  # ベースクラス数（CIFAR100）
num_classes: 100  # 総クラス数（CIFAR100）
way: 5  # 各新規セッションのクラス数（CIFAR100）
shot: 5  # 各クラスのショット数（Few-Shot用）

# その他の設定
start_session: 0
model_dir:       # nullまたはモデルパラメータのディレクトリ
num_workers: 8
gpu: '0'  # カンマ区切りで複数指定可能（例: '0,1,2,3'）
seed: 1

# フラグ
not_data_init: false
set_no_val: false
debug: false

# Comet ML設定
comet_project:       # プロジェクト名（nullの場合はdataset名を使用）
comet_workspace:       # ワークスペース名（nullの場合はデフォルト）
comet_disabled: false  # Comet MLを無効化する場合はtrue
comet_tags:
- orm
create_sessions:
  label_column: Label    # ラベル列の名前
  output_dir: data/index_list    # セッションファイルの出力ディレクトリ
  dataset_name: CICIDS2017_flow_improved    # データセット名
  base_class: 2  # ベースクラス数（トレーニング設定と一致させる）
  num_classes: 10  # 総クラス数
  way: 1  # 各新規セッションのクラス数
  shot: 5  # 各クラスのショット数（Few-Shot用）
  seed: 42  # 乱数シード
  base_use_class_index: false  # ベースセッションファイルにクラスインデックスを使用（false: データインデックス）
  base_labels:                                                     # ベースセッションに使用するラベルのリスト（null: 自動、リスト指定時はそのラベルのみ使用）
  - BENIGN
  - Bot
