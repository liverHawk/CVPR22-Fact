# Per-environment overrides. Loaded via --config or $FACT_CONFIG:
#   uv run python train.py --config params.yaml --config configs/server.yaml
#   FACT_CONFIG=configs/server.yaml dvc repro   # dvc.yaml cmd is fixed; env carries the extra file
dataroot: ${DATA_ROOT:-data/}
flow_glob: ${FLOW_GLOB:-data/cicids2017/csv/*.csv}
gpu: '0,1'
num_workers: 4
# --- CIC flow: make_session.py + MLP encoder (models/mlp_encoder.py) ---
mlp_in_dim: null
mlp_hidden: 256
mlp_out: 512
mlp_pre_layers: 2  # Linear-LN-ReLU blocks before the mixup point
mlp_post_layers: 1  # blocks after it; the last one maps to mlp_out
normalize: none  # none | standard | minmax | robust (fit on base-train only)
embed_cols: []  # e.g. ['Destination Port', 'Protocol'] -> nn.Embedding, not scaled
embed_dim: 8
embed_max_vocab: 1024  # top base-train values per column; unseen -> OOV id 0
